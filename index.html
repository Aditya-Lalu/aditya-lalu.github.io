<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Aditya Lalu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #000; color: #F2F1EF; cursor: default;
    font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: clamp(.95rem, 1.5vw, 1.15rem); line-height: 1.8;
    padding: calc(env(safe-area-inset-top, 0px) + clamp(1.25rem, 3vw, 2.5rem)) clamp(1.25rem, 3vw, 2.5rem);
    box-sizing: border-box;
  }
  .ln { white-space: pre-wrap; overflow-wrap: anywhere; }
  .pr { color: #E0243A; }
  .dim, .ts { color: #5C5C5C; }
  .ts.hot, .note { color: #E0243A; }
  .note { padding-left: 11ch; }
  .tx { position: relative; }
  a { color: #F2F1EF; text-decoration: underline; text-decoration-color: #E0243A; text-underline-offset: .2em; }
  a:hover { color: #E0243A; }
  .cursor { display: inline-block; width: .6em; height: 1.15em; background: #F2F1EF; vertical-align: -0.22em; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* small red stutter while it "builds", and a glitch on whatever lands after the skip */
  .tx.stutter::before, .tx.stutter::after, .tx.hit::before, .tx.hit::after {
    content: attr(data-text); position: absolute; left: 0; top: 0; white-space: pre; pointer-events: none; color: #E0243A; opacity: 0;
  }
  .tx.stutter::before { animation: sA .16s steps(1); }
  .tx.stutter::after { animation: sB .16s steps(1); }
  .tx.hit { animation: hitColor .7s ease forwards; }
  .tx.hit::before { color: #FFE3E8; animation: sA .22s steps(1); }
  .tx.hit::after { animation: sB .22s steps(1); }
  @keyframes sA { 0% { opacity: 1; clip-path: inset(0 0 55% 0); transform: translateX(-4px); } 50% { opacity: 1; clip-path: inset(50% 0 0 0); transform: translateX(3px); } 100% { opacity: 0; } }
  @keyframes sB { 0% { opacity: .85; clip-path: inset(30% 0 30% 0); transform: translateX(2px); } 50% { opacity: 0; } }
  @keyframes hitColor { 0% { color: #E0243A; } 100% { color: #F2F1EF; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
</head>
<body>
<div id="term" aria-live="polite"></div>
<noscript>
  <div class="ln"><span class="pr">aditya@portfolio</span><span class="dim">:~$</span> ./build portfolio</div>
  <div class="ln"><span class="dim">[status]</span> still not done. check back soon.</div>
  <div class="ln"><span class="dim">[contact]</span> <a href="mailto:lalua3787@gmail.com">lalua3787@gmail.com</a></div>
</noscript>

<script>
(function () {
  var EMAIL = 'lalua3787@gmail.com';
  var term = document.getElementById('term');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var SKIP_AT = 2400 + Math.random() * 400;   // time skips ~2.4-2.8s in
  var LAND = 10000 + Math.random() * 900;     // ...and lands around 00:10
  var state = 'running', timers = [], counter, stutterTimer, skipCheck, progTx, buildTx;
  var start = performance.now();
  var cursor = document.createElement('span'); cursor.className = 'cursor';

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function now() { return performance.now() - start; }
  function stamp(ms) { var s = Math.floor(ms / 1000); return '[' + pad(Math.floor(s / 60)) + ':' + pad(s % 60) + '.' + pad(Math.floor(ms / 10) % 100) + ']'; }
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function row(html) { var d = document.createElement('div'); d.className = 'ln'; if (html) d.innerHTML = html; term.appendChild(d); return d; }
  function logLine(ms, hot) {
    var d = row();
    var t = document.createElement('span'); t.className = 'ts' + (hot ? ' hot' : ''); t.textContent = stamp(ms);
    var tx = document.createElement('span'); tx.className = 'tx';
    d.appendChild(t); d.appendChild(document.createTextNode(' ')); d.appendChild(tx);
    return tx;
  }
  function promptLine() {
    var d = row('<span class="pr">aditya@portfolio</span><span class="dim">:~$</span> ');
    var tx = document.createElement('span'); tx.className = 'tx'; d.appendChild(tx);
    return { row: d, tx: tx };
  }
  function typeInto(tx, text, speed, done) {
    var i = 0;
    (function step() { if (i >= text.length) { if (done) done(); return; } tx.textContent += text[i++]; later(step, speed); })();
  }
  function glitch(tx) { tx.setAttribute('data-text', tx.textContent); tx.classList.remove('hit'); void tx.offsetWidth; tx.classList.add('hit'); }
  function progress(p) { return 'building portfolio... ' + p + '%'; }

  function ending(skipped) {
    var n = document.createElement('div'); n.className = 'ln note';
    n.textContent = '+' + (skipped / 1000).toFixed(2) + 's skipped';
    term.appendChild(n);
    var done = logLine(LAND, true); done.textContent = 'still not done. check back soon.'; glitch(done);
    row('<span class="dim">[contact]</span> <a href="mailto:' + EMAIL + '">' + EMAIL + '</a>');
    promptLine().row.appendChild(cursor);
  }

  // reduced motion: just show the finished screen
  if (reduce) {
    promptLine().tx.textContent = './build portfolio';
    logLine(400).textContent = progress(99);
    ending(LAND - 400);
    return;
  }

  // 1. it starts "building" in real time
  var p = promptLine(); buildTx = p.tx; p.row.appendChild(cursor);
  later(function () {
    typeInto(buildTx, './build portfolio', 35, function () {
      cursor.remove();
      later(function () {
        var pct = 1;
        progTx = logLine(now()); progTx.textContent = progress(pct);
        counter = setInterval(function () { if (pct < 97) progTx.textContent = progress(++pct); }, 55);
      }, 150);
    });
  }, 300);

  (function scheduleStutter() {
    stutterTimer = setTimeout(function () {
      if (state !== 'running') return;
      if (progTx) { progTx.setAttribute('data-text', progTx.textContent); progTx.classList.remove('stutter'); void progTx.offsetWidth; progTx.classList.add('stutter'); }
      scheduleStutter();
    }, 700 + Math.random() * 500);
  })();

  // 2. time skips... and it's still not done
  function timeSkip() {
    if (state !== 'running') return;
    state = 'skipped';
    timers.forEach(clearTimeout); clearInterval(counter); clearTimeout(stutterTimer); clearInterval(skipCheck);
    cursor.remove();
    buildTx.textContent = './build portfolio';
    if (!progTx) progTx = logLine(now());
    progTx.classList.remove('stutter');
    progTx.textContent = progress(99);
    glitch(progTx);
    ending(LAND - now());
  }

  skipCheck = setInterval(function () { if (now() >= SKIP_AT) timeSkip(); }, 30);
  document.addEventListener('click', function (e) { if (!e.target.closest('a')) timeSkip(); });
  window.addEventListener('keydown', timeSkip);
})();
</script>
</body>
</html>
